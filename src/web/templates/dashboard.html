<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW Airport - Scheduling Window</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/dashboard.css?v=13" />
  </head>
  <body>
    <div class="shell">
      <div class="panel">
        <div id="app">
          <div class="app-shell">
            <section class="app-main">

              <div class="board-block">
                <div class="board-title">Departures</div>
                <div class="table-scroll">
                  <table class="board-table flights-board">
                    <thead>
                      <tr>
                        <th>Route</th>
                        <th>Departure</th>
                        <th>Arrival</th>
                        <th>Duration</th>
                        <th>Airline</th>
                        <th>Type</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody id="departure_rows">
                      <tr>
                        <td colspan="7" class="muted">Waiting for departure snapshot...</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="board-block section-gap">
                <div class="board-title">Arrivals</div>
                <div class="table-scroll">
                  <table class="board-table flights-board">
                    <thead>
                      <tr>
                        <th>Route</th>
                        <th>Departure</th>
                        <th>Arrival</th>
                        <th>Duration</th>
                        <th>Airline</th>
                        <th>Type</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody id="arrival_rows">
                      <tr>
                        <td colspan="7" class="muted">Waiting for arrival snapshot...</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

            </section>
          </div>
        </div>
      </div>
    </div>
    <script src="/static/dashboard.js?v=4"></script>
  </body>
</html>
