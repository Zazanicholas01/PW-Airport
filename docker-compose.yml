name: pw-airport-dashboard

services:
  postgres:
    image: postgres:16-alpine
    container_name: pw_airport_postgres
    command: ["postgres", "-c", "timezone=Europe/Rome"]
    environment:
      POSTGRES_DB: Airport
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
    ports:
      - "5433:5432"
    volumes:
      - postgres-dashboard-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pw_airport_db_init
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app:ro
      - ./data/logs:/logs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: Airport
      POSTGRES_ADMIN_DB: postgres
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
      PYTHONPATH: /app
      LOG_DIR: /logs
    command: python /app/scripts/init_db.py
    restart: "no"
  
  db-seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ./:/app:ro
      - ./data/logs:/logs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: Airport
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
      PYTHONPATH: /app
      LOG_DIR: /logs
    command: python /app/scripts/startup.py
    restart: "no"

  dashboard-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pw_airport_dashboard_app
    depends_on:
      postgres:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ./:/app:ro
      - ./data/logs:/logs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: Airport
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
      PYTHONPATH: /app
      LOG_DIR: /logs
    expose:
      - "8000"
    command: uvicorn src.web.dashboard_app:app --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  
  nginx:
    image: nginx:1.27-alpine
    container_name: pw_airport_nginx
    depends_on:
      dashboard-app:
        condition: service_started
    ports:
      - "8001:80"
    volumes:
      - ./docker/nginx/dashboard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/web/static:/var/www/static:ro
    restart: unless-stopped
  
  dbgate:
    image: dbgate/dbgate
    container_name: pw_airport_dbgate
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5051:3000"
    volumes:
      - dbgate-data:/root/.dbgate
    environment:
      CONNECTIONS: airport

      LABEL_airport: PW Airport Postgres
      SERVER_airport: postgres
      PORT_airport: 5432
      USER_airport: airport
      PASSWORD_airport: airport
      DEFAULT_DATABASE_airport: Airport
      ENGINE_airport: postgres@dbgate-plugin-postgres
    restart: unless-stopped

volumes:
  postgres-dashboard-data:
  dbgate-data:
