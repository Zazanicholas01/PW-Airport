name: pw-airport-dashboard

services:
  postgres:
    image: postgres:16-alpine
    container_name: pw_airport_postgres
    command: ["postgres", "-c", "timezone=Europe/Rome"]
    environment:
      POSTGRES_DB: Airport
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
    ports:
      - "5433:5432"
    volumes:
      - postgres-dashboard-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pw_airport_db_init
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app:ro
      - ./data/logs:/logs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: Airport
      POSTGRES_ADMIN_DB: postgres
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
      PYTHONPATH: /app
      LOG_DIR: /logs
    command: python /app/scripts/init_db.py
    restart: "no"
  
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pw_airport_backend
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ./:/app:ro
      - ./data/logs:/logs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: Airport
      POSTGRES_ADMIN_DB: postgres
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
      PYTHONPATH: /app
      LOG_DIR: /logs
    command: python /app/scripts/startup.py
    ports:
      - "8765:8765"
    restart: unless-stopped

  dashboard-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pw_airport_dashboard_app
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    working_dir: /app
    volumes:
      - ./:/app:ro
      - ./data/logs:/logs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: Airport
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
      PYTHONPATH: /app
      LOG_DIR: /logs
    expose:
      - "8000"
    command: uvicorn src.web.dashboard_app:app --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  
  nginx:
    image: nginx:1.27-alpine
    container_name: pw_airport_nginx
    depends_on:
      dashboard-app:
        condition: service_started
    ports:
      - "8001:80"
    volumes:
      - ./docker/nginx/dashboard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/web/static:/var/www/static:ro
    restart: unless-stopped
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pw_airport_pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ghiaccio123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5051:80"
    volumes:
      - pgadmin-dashboard-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    restart: unless-stopped

volumes:
  postgres-dashboard-data:
  pgadmin-dashboard-data: